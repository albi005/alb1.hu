<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAVIR Import/Export Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #fff; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #map {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
<img id="map" src="" alt="MAVIR import/export map">

<script>
const MAP_URL = 'https://rtdwweb.mavir.hu/rtdwweb/webuser/map/desktop/hu';
const mapImg = document.getElementById('map');

function refresh() {
  mapImg.src = MAP_URL + '?' + Date.now();
}

let retryDelay = 1000;
mapImg.onerror = () => {
  setTimeout(refresh, retryDelay);
  retryDelay = Math.min(retryDelay * 4, 10*60*1000);
};
mapImg.onload = () => { retryDelay = 1000; };
refresh();
setInterval(refresh, 3*60*1000);
</script>
</body>
</html>
